<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LITTLE EDEN Society | Enquiry</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header -->
    <header>
        <h1>LITTLE EDEN Society</h1>
        <!-- Navigation -->
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="services.html">Care & Services</a></li>
                <li><a href="enquiry.html">Enquiry</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>
    <!-- Main Content -->
    <main>
        <section>
            <h2>Make an Enquiry</h2>
            <img src="images/community.jpg" alt="LITTLE EDEN community and volunteer activities" class="content-image" width="350" length="350">
            <p>
                If you would like to volunteer, donate, become a sponsor
                or ask a general question, please complete the form below.
            </p>
        </section>
        <!-- Enquiry Form -->
        <section>
            <form action="#" method="post">
                <!-- Full Name -->
                <label for="fullname">
                    Full Name:
                </label>
                <input
                    type="text"
                    id="fullname"
                    name="fullname"
                    placeholder="Enter your full name"
                    required
                >
                <!-- Email -->
                <label for="email">
                    Email Address:
                </label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    required
                >
                <!-- Phone -->
                <label for="phone">
                    Phone Number:
                </label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter your phone number"
                >
                <!-- Enquiry Type -->
                <label for="enquiry-type">
                    Enquiry Type:
                </label>
                <select id="enquiry-type" name="enquiry-type" required>
                    <option value="">
                        Select an option
                    </option>
                    <option value="volunteer">
                        Volunteer
                    </option>
                    <option value="donation">
                        Donation
                    </option>
                    <option value="sponsorship">
                        Sponsorship
                    </option>
                    <option value="general">
                        General Enquiry
                    </option>
                </select>
                <!-- Message -->
                <label for="message">
                    Message:
                </label>
                <textarea
                    id="message"
                    name="message"
                    rows="6"
                    placeholder="Enter your message"
                    required
                ></textarea>
                <!-- Submit -->
                <button type="submit">
                    Submit Enquiry
                </button>
            </form>
        </section>
    </main>
    <!-- Footer -->
    <footer>
        <p>
            &copy; 2026 LITTLE EDEN Society. All Rights Reserved.
        </p>
    </footer>
</body>
</html>
